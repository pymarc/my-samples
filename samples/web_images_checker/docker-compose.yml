
services:
  api:
    build: .
    working_dir: /app
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  worker:
    build: .
    command: celery -A worker.celery_handler.celery_app worker --loglevel=info
    depends_on:
      - redis

  flower:
    build: .
    command: celery -A worker.celery_handler.celery_app flower --port=5555
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - worker